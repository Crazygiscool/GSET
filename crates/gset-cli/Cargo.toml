[package]
name = "gset-cli"
description = "The gset command-line interface"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# The installed binary is named `gset`, not `gset-cli`. This is the one
# compatibility surface the rewrite preserves: install.sh renames the extracted
# archive member to `gset`, and every packaging manifest (choco, AUR,
# Debian) expects `gset` on PATH.
[[bin]]
name = "gset"
path = "src/main.rs"

[dependencies]
gset-ir = { workspace = true }
gset-frontend = { workspace = true }
gset-backend = { workspace = true }
gset-semantic = { workspace = true }
gset-deps = { workspace = true }
rayon = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "startup"
harness = false
[features]
default = ["python", "javascript", "typescript"]
python = ["gset-frontend/python"]
javascript = ["gset-frontend/javascript"]
typescript = ["gset-frontend/typescript"]
go = ["gset-frontend/go"]
java = ["gset-frontend/java"]
ruby = ["gset-frontend/ruby"]
c = ["gset-frontend/c"]
cpp = ["gset-frontend/cpp"]
rust = ["gset-frontend/rust"]
