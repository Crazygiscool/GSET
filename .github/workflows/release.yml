name: Release

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Install cross
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Install rust target
        run: rustup target add ${{ matrix.target }}
      - name: Build release binary
        run: |
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            cross build --release --target ${{ matrix.target }} -p gset-cli
          else
            cargo build --release --target ${{ matrix.target }} -p gset-cli
          fi
        shell: bash

      - name: Resolve artifact path
        shell: bash
        run: |
          set -euo pipefail
          BIN="target/${{ matrix.target }}/release/gset"
          if [ "${{ runner.os }}" = "Windows" ]; then
            BIN="${BIN}.exe"
          fi
          echo "BIN=${BIN}" >> "$GITHUB_ENV"
          OUTPUT_NAME="gset-$(echo ${{ matrix.os }} | sed 's/-latest//' | sed 's/ubuntu/linux/;s/macos/darwin/')"
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            OUTPUT_NAME="gset-windows-amd64"
          elif [ "${{ matrix.os }}" = "macos-latest" ] && [ "${{ matrix.target }}" = "aarch64-apple-darwin" ]; then
            OUTPUT_NAME="gset-darwin-arm64"
          elif [ "${{ matrix.os }}" = "macos-15-intel" ]; then
            OUTPUT_NAME="gset-darwin-amd64"
          elif [ "${{ matrix.os }}" = "ubuntu-latest" ] && [ "${{ matrix.target }}" = "x86_64-unknown-linux-gnu" ]; then
            OUTPUT_NAME="gset-linux-amd64"
          elif [ "${{ matrix.os }}" = "ubuntu-latest" ] && [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            OUTPUT_NAME="gset-linux-arm64"
          fi
          echo "OUTPUT_NAME=${OUTPUT_NAME}" >> "$GITHUB_ENV"

      - name: Prepare archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "$BIN" release/gset.exe
            cd release && 7z a "../${OUTPUT_NAME}.zip" gset.exe
            cd ..
          else
            cp "$BIN" release/gset
            cd release && tar -czf "../${OUTPUT_NAME}.tar.gz" gset
            cd ..
          fi

      - name: Build Debian packages
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          cargo install cargo-deb --locked
          DEB_ARCH="amd64"
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            DEB_ARCH="arm64"
          fi
          mkdir -p target/debian
          cargo deb --no-build --no-strip --package gset-cli --target ${{ matrix.target }} -o target/debian/gset-${{ steps.version.outputs.VERSION }}-${DEB_ARCH}.deb

      - name: Upload Debian packages
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.OUTPUT_NAME }}-deb
          path: target/debian/*.deb
          retention-days: 5

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.OUTPUT_NAME }}
          path: ${{ env.OUTPUT_NAME }}.*
          retention-days: 5
  windows-installers:
    needs: build
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Download Windows binary
        uses: actions/download-artifact@v4
        with:
          name: gset-windows-amd64
          path: win
          merge-multiple: true

      - name: Extract binary
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path install | Out-Null
          Get-ChildItem -Path win -Filter '*.zip' | ForEach-Object {
            Expand-Archive -LiteralPath $_.FullName -DestinationPath install -Force
          }
          if (-not (Test-Path 'install\gset.exe')) { throw 'gset.exe missing after extraction' }

      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          $candidates = @("${env:ProgramFiles(x86)}\NSIS", "$env:ProgramFiles\NSIS")
          $nsisDir = $candidates | Where-Object { Test-Path "$_\makensis.exe" } | Select-Object -First 1
          if (-not $nsisDir) { throw "makensis.exe not found (looked in $($candidates -join ', '))" }
          "$nsisDir" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install WiX toolset
        shell: pwsh
        run: |
          dotnet tool install --global wix
          "$HOME\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build EXE installer (NSIS)
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.VERSION }}"
          $root = "$env:GITHUB_WORKSPACE"
          makensis "-DVERSION=$version" `
            "-DBINARY=$root\install\gset.exe" `
            "-DLICENSE=$root\LICENSE" `
            "-DICON=$root\packages\windows\gset.ico" `
            "-DOUT=$root\gset-$version-windows-amd64-setup.exe" `
            "$root\packages\windows\gset.nsi"

      - name: Smoke test EXE installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = "${{ steps.version.outputs.VERSION }}"
          $root = "$env:GITHUB_WORKSPACE"
          $setup = "$root\gset-$version-windows-amd64-setup.exe"
          $installDir = "$env:ProgramFiles\GSET"

          # NSIS installers/uninstallers are GUI-subsystem apps: `&` would not
          # wait or set $LASTEXITCODE, so Start-Process -Wait and check ExitCode.
          $p = Start-Process -FilePath $setup -ArgumentList @('/S', '/ALLUSERS') -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "setup exited $($p.ExitCode)" }
          if (-not (Test-Path "$installDir\gset.exe")) { throw "gset.exe not installed" }

          $sysPath = (Get-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager\Environment' -Name Path).Path
          if ($sysPath -notmatch [regex]::Escape($installDir)) { throw "system PATH not updated: $sysPath" }

          & "$installDir\gset.exe" version
          if ($LASTEXITCODE -ne 0) { throw "gset version failed" }

          $p = Start-Process -FilePath "$installDir\Uninstall GSET.exe" -ArgumentList @('/S', "_?=$installDir") -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "uninstaller exited $($p.ExitCode)" }
          if (Test-Path "$installDir\gset.exe") { throw "uninstall left gset.exe" }
          if (Test-Path 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\GSET') { throw "uninstall key (HKLM) still present" }
          if (Test-Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\GSET') { throw "uninstall key (HKCU) still present" }
          $sysPath = (Get-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager\Environment' -Name Path).Path
          if ($sysPath -match [regex]::Escape($installDir)) {
            Write-Host "System PATH after uninstall (contains leftover entry):"
            Write-Host $sysPath
            throw "PATH still contains GSET after uninstall"
          }

      - name: Build MSI installer (WiX)
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.VERSION }}"
          $root = "$env:GITHUB_WORKSPACE"
          wix build "$root\packages\windows\gset.wxs" `
            -d Version=$version `
            -d Binary="$root\install\gset.exe" `
            -d License="$root\LICENSE" `
            -d Icon="$root\packages\windows\gset.ico" `
            -o "$root\gset-$version-windows-amd64.msi"

      - name: Smoke test MSI installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = "${{ steps.version.outputs.VERSION }}"
          $root = "$env:GITHUB_WORKSPACE"
          $msi = "$root\gset-$version-windows-amd64.msi"
          $installDir = "$env:ProgramFiles\GSET"

          $p = Start-Process msiexec.exe -ArgumentList @('/i', "`"$msi`"", '/qn', '/norestart', "/l*v `"$root\msi-install.log`"") -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "msiexec /i failed with $($p.ExitCode)" }
          if (-not (Test-Path "$installDir\gset.exe")) { throw "MSI did not install gset.exe" }
          $sysPath = (Get-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager\Environment' -Name Path).Path
          if ($sysPath -notmatch [regex]::Escape($installDir)) { throw "MSI did not update system PATH" }

          $p = Start-Process msiexec.exe -ArgumentList @('/x', "`"$msi`"", '/qn', '/norestart', "/l*v `"$root\msi-uninstall.log`"") -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "msiexec /x failed with $($p.ExitCode)" }
          if (Test-Path "$installDir\gset.exe") { throw "MSI uninstall left gset.exe" }

      - name: Upload EXE installer
        uses: actions/upload-artifact@v4
        with:
          name: gset-windows-installer-exe
          path: gset-${{ steps.version.outputs.VERSION }}-windows-amd64-setup.exe
          retention-days: 5

      - name: Upload MSI installer
        uses: actions/upload-artifact@v4
        with:
          name: gset-windows-installer-msi
          path: gset-${{ steps.version.outputs.VERSION }}-windows-amd64.msi
          retention-days: 5
  release:
    needs: [build, windows-installers]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -la dist/

      - name: Create checksums
        working-directory: dist
        run: |
          sha256sum ./* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Generate Release Notes
        id: notes
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          cat > RELEASE_NOTES.md << EOF
          # GSET v$VERSION Release
          ## Installation
          ### Linux / macOS / Windows (Git Bash)
          ```bash
          curl -fsSL https://raw.githubusercontent.com/Crazygiscool/GSETLang/main/install.sh | bash
          ```
          ### Manual Install
          Download the appropriate archive for your platform from the assets below.
          ### Windows Installers
          - \`gset-${VERSION}-windows-amd64-setup.exe\` - NSIS setup (all users or just for me)
          - \`gset-${VERSION}-windows-amd64.msi\` - MSI (all users)
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
